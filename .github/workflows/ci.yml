name: Greenline CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. Backend CI (Lint, Unit & Integration Tests)
  # ==========================================
  backend-ci:
    name: Backend CI (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest-cov ruff

      - name: Lint with Ruff
        run: |
          ruff check backend/app backend/tests

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: backend
        run: |
          pytest backend/tests -v --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload Coverage to Artifacts
        if: matrix.python-version == '3.10'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: coverage.xml
          retention-days: 7

  # ==========================================
  # 2. Frontend Verification (Node 22.x)
  # ==========================================
  frontend-ci:
    name: Frontend CI (Node 22.x)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: TypeScript Type Check
        working-directory: frontend
        run: |
          npx tsc --noEmit

      - name: Run ESLint
        working-directory: frontend
        run: |
          npm run lint

      - name: Run Vitest Component Tests
        working-directory: frontend
        run: |
          npm test

  # ==========================================
  # 3. End-to-End (E2E) Browser Tests (Playwright)
  # ==========================================
  e2e-ci:
    name: E2E Playwright Tests
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          cd frontend
          npm ci
          npx playwright install --with-deps chromium

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm run build

      - name: Start Backend Server
        env:
          DATABASE_URL: sqlite+aiosqlite:///./data/investments.db
        run: |
          mkdir -p data
          PYTHONPATH=backend python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          timeout 30 bash -c 'until curl -s http://localhost:8000/docs > /dev/null; do sleep 1; done'

      - name: Start Frontend Server
        working-directory: frontend
        run: |
          npm start -- --port 3000 &
          timeout 30 bash -c 'until curl -s http://localhost:3000 > /dev/null; do sleep 1; done'

      - name: Run Playwright E2E Tests
        working-directory: frontend
        env:
          BASE_URL: http://localhost:3000
          CI: true
        run: |
          npx playwright test

      - name: Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
