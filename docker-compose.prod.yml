services:
  networth:
    build:
      context: ./services/networth
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      - DATABASE_URL=${DATABASE_URL:-oracle+oracledb://@}
      - ORACLE_USER=${ORACLE_USER:-}
      - ORACLE_PASSWORD=${ORACLE_PASSWORD:-}
      - ORACLE_DSN=${ORACLE_DSN:-}
      - SECRET_KEY=${SECRET_KEY:-super-secret-investment-tracker-key-change-in-prod-2026}
      - DEFAULT_ADMIN_USER=admin
      - DEFAULT_ADMIN_PASSWORD=admin123
      - PYTHONPATH=/app
    restart: unless-stopped

  community:
    build:
      context: ./services/community
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=${DATABASE_URL_COMMUNITY:-oracle+oracledb://@}
      - ORACLE_COMMUNITY_USER=${ORACLE_COMMUNITY_USER:-GREENLINE_COMMUNITY}
      - COMMUNITY_DB_PASSWORD=${COMMUNITY_DB_PASSWORD:-SecureCommunity2026#DbPass}
      - ORACLE_DSN=${ORACLE_DSN:-}
      - ORACLE_SCHEMA=${ORACLE_SCHEMA:-ADMIN}
      - PORT=8002
      - PYTHONPATH=/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
    ports:
      - "3000:3000"
    environment:
      - NETWORTH_URL=http://networth:8000
      - COMMUNITY_URL=http://community:8002/api/v1/community
    depends_on:
      - networth
      - community
    restart: unless-stopped
