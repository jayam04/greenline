services:
  oracle:
    image: gvenzl/oracle-free:slim-faststart
    container_name: greenline-oracle
    profiles:
      - localdockerdb
    environment:
      ORACLE_PASSWORD: ${ORACLE_LOCAL_PASSWORD:-test_password}
      APP_USER: ${ORACLE_LOCAL_USER:-greenline_test}
      APP_USER_PASSWORD: ${ORACLE_LOCAL_PASSWORD:-test_password}
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: greenline-redis
    ports:
      - "6379:6379"
    restart: always

  networth:
    build:
      context: ./services/networth
      dockerfile: Dockerfile
    command: >
      sh -c 'if [ "$$ENV" = "prod" ]; then
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers $${UVICORN_WORKERS:-4}
      else
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      fi'
    ports:
      - "${NETWORTH_PORT:-8000}:8000"
    volumes:
      - ./data:/data
      - ./services/networth/app:/app/app
      - ./services/networth/tests:/app/tests
    environment:
      ENV: ${ENV:-dev}
      DB_TARGET: ${DB_TARGET:-localdockerdb}
      IS_DOCKER: "true"
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_URL_NETWORTH: ${DATABASE_URL_NETWORTH:-}
      ORACLE_USER: ${ORACLE_NETWORTH_USER:-${ORACLE_USER:-}}
      ORACLE_PASSWORD: ${ORACLE_NETWORTH_PASSWORD:-${ORACLE_PASSWORD:-}}
      ORACLE_DSN: ${ORACLE_DSN:-}
      ORACLE_SCHEMA: ${ORACLE_SCHEMA:-ADMIN}
      ORACLE_LOCAL_USER: ${ORACLE_LOCAL_USER:-greenline_test}
      ORACLE_LOCAL_PASSWORD: ${ORACLE_LOCAL_PASSWORD:-test_password}
      ORACLE_LOCAL_DSN: ${ORACLE_LOCAL_DSN:-oracle:1521/FREEPDB1}
      ORACLE_CLOUD_USER: ${ORACLE_CLOUD_USER:-${ORACLE_USER:-}}
      ORACLE_CLOUD_PASSWORD: ${ORACLE_CLOUD_PASSWORD:-${ORACLE_PASSWORD:-}}
      ORACLE_CLOUD_DSN: ${ORACLE_CLOUD_DSN:-${ORACLE_DSN:-}}
      SECRET_KEY: ${SECRET_KEY:-super-secret-investment-tracker-key-change-in-prod-2026}
      DEFAULT_ADMIN_USER: ${DEFAULT_ADMIN_USER:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-admin123}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-jayam04.eu.auth0.com}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-http://localhost:8000}
      AUTH0_ISSUER: ${AUTH0_ISSUER:-https://jayam04.eu.auth0.com/}
      AUTH0_TEST_MODE: ${AUTH0_TEST_MODE:-false}
      ENABLE_TIMING_LOGS: ${ENABLE_TIMING_LOGS:-true}
      LOG_SQL_QUERIES: ${LOG_SQL_QUERIES:-false}
      SLOW_QUERY_THRESHOLD_MS: ${SLOW_QUERY_THRESHOLD_MS:-50.0}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      NETWORTH_HISTORY_URL: ${NETWORTH_HISTORY_URL:-http://networth-history:8003}
      NETWORTH_HISTORY_SERVICE_TOKEN: ${NETWORTH_HISTORY_SERVICE_TOKEN:-local-networth-history-token-change-in-prod}
      PYTHONPATH: /app
    depends_on:
      oracle:
        condition: service_healthy
        required: false
      redis:
        condition: service_started
        required: false
      networth-history:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  networth-history:
    build:
      context: .
      dockerfile: services/networth_history/Dockerfile
    command: uvicorn services.networth_history.app.main:app --host 0.0.0.0 --port 8003 --workers 1
    expose:
      - "8003"
    volumes:
      - ./services/networth/app:/opt/greenline/services/networth/app
      - ./services/networth_history/app:/opt/greenline/services/networth_history/app
    environment:
      ENV: ${ENV:-dev}
      DB_TARGET: ${DB_TARGET:-localdockerdb}
      NETWORTH_HISTORY_MODE: "true"
      NETWORTH_HISTORY_DAILY: "true"
      NETWORTH_HISTORY_SCHEMA: GREENLINE_NW_HISTORY
      NETWORTH_HISTORY_SERVICE_TOKEN: ${NETWORTH_HISTORY_SERVICE_TOKEN:-local-networth-history-token-change-in-prod}
      DATABASE_URL: ""
      DATABASE_URL_NETWORTH_HISTORY: ${DATABASE_URL_NETWORTH_HISTORY:-}
      ORACLE_NETWORTH_HISTORY_USER: ${ORACLE_NETWORTH_HISTORY_USER:-GREENLINE_NW_HISTORY}
      ORACLE_NETWORTH_HISTORY_PASSWORD: ${ORACLE_NETWORTH_HISTORY_PASSWORD:-LocalHistory2026#Db}
      ORACLE_LOCAL_DSN: ${ORACLE_LOCAL_DSN:-oracle:1521/FREEPDB1}
      ORACLE_CLOUD_DSN: ${ORACLE_CLOUD_DSN:-${ORACLE_DSN:-}}
      ORACLE_SCHEMA: ADMIN
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-jayam04.eu.auth0.com}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-http://localhost:8000}
      AUTH0_ISSUER: ${AUTH0_ISSUER:-https://jayam04.eu.auth0.com/}
      AUTH0_TEST_MODE: ${AUTH0_TEST_MODE:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PYTHONPATH: /opt/greenline/services/networth:/opt/greenline
    depends_on:
      oracle:
        condition: service_healthy
        required: false
      redis:
        condition: service_started
        required: false
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8003/health"]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  community:
    build:
      context: ./services/community
      dockerfile: Dockerfile
    command: >
      sh -c 'if [ "$$ENV" = "prod" ]; then
        exec uvicorn app.main:app --host 0.0.0.0 --port 8002 --workers $${UVICORN_WORKERS:-4}
      else
        exec uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload
      fi'
    ports:
      - "${COMMUNITY_PORT:-8002}:8002"
    volumes:
      - ./services/community/app:/app/app
      - ./services/community/tests:/app/tests
    environment:
      ENV: ${ENV:-dev}
      DB_TARGET: ${DB_TARGET:-localdockerdb}
      IS_DOCKER: "true"
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_URL_COMMUNITY: ${DATABASE_URL_COMMUNITY:-}
      ORACLE_COMMUNITY_USER: ${ORACLE_COMMUNITY_USER:-GREENLINE_COMMUNITY}
      COMMUNITY_DB_PASSWORD: ${COMMUNITY_DB_PASSWORD:-SecureCommunity2026#DbPass}
      ORACLE_DSN: ${ORACLE_DSN:-}
      ORACLE_SCHEMA: ${ORACLE_SCHEMA:-ADMIN}
      ORACLE_LOCAL_USER: ${ORACLE_LOCAL_USER:-greenline_test}
      ORACLE_LOCAL_PASSWORD: ${ORACLE_LOCAL_PASSWORD:-test_password}
      ORACLE_LOCAL_DSN: ${ORACLE_LOCAL_DSN:-oracle:1521/FREEPDB1}
      ORACLE_CLOUD_DSN: ${ORACLE_CLOUD_DSN:-${ORACLE_DSN:-}}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-jayam04.eu.auth0.com}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-http://localhost:8000}
      AUTH0_ISSUER: ${AUTH0_ISSUER:-https://jayam04.eu.auth0.com/}
      AUTH0_TEST_MODE: ${AUTH0_TEST_MODE:-false}
      ENABLE_TIMING_LOGS: ${ENABLE_TIMING_LOGS:-true}
      LOG_SQL_QUERIES: ${LOG_SQL_QUERIES:-false}
      SLOW_QUERY_THRESHOLD_MS: ${SLOW_QUERY_THRESHOLD_MS:-50.0}
      PORT: 8002
      PYTHONPATH: /app
    depends_on:
      oracle:
        condition: service_healthy
        required: false
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: ${FRONTEND_TARGET:-dev}
      args:
        NEXT_PUBLIC_AUTH0_DOMAIN: ${NEXT_PUBLIC_AUTH0_DOMAIN:-jayam04.eu.auth0.com}
        NEXT_PUBLIC_AUTH0_CLIENT_ID: ${NEXT_PUBLIC_AUTH0_CLIENT_ID:-wTsdPwbGO91s4SjnzhA4pC9ik4MFEjby}
        NEXT_PUBLIC_AUTH0_AUDIENCE: ${NEXT_PUBLIC_AUTH0_AUDIENCE:-http://localhost:8000}
        NEXT_PUBLIC_AUTH0_ENABLED: ${NEXT_PUBLIC_AUTH0_ENABLED:-true}
    command: >
      sh -c 'if [ "$$ENV" = "prod" ]; then
        exec npm start -- -p 3000
      else
        exec npm run dev -- -H 0.0.0.0 -p 3000
      fi'
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - ENV=${ENV:-dev}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
      - INTERNAL_API_URL=${INTERNAL_API_URL:-http://localhost:3000}
      - NETWORTH_URL=${NETWORTH_URL:-http://networth:8000}
      - COMMUNITY_URL=${COMMUNITY_URL:-http://community:8002/api/v1/community}
      - NEXT_PUBLIC_AUTH0_DOMAIN=${NEXT_PUBLIC_AUTH0_DOMAIN:-jayam04.eu.auth0.com}
      - NEXT_PUBLIC_AUTH0_CLIENT_ID=${NEXT_PUBLIC_AUTH0_CLIENT_ID:-wTsdPwbGO91s4SjnzhA4pC9ik4MFEjby}
      - NEXT_PUBLIC_AUTH0_AUDIENCE=${NEXT_PUBLIC_AUTH0_AUDIENCE:-http://localhost:8000}
      - NEXT_PUBLIC_AUTH0_ENABLED=${NEXT_PUBLIC_AUTH0_ENABLED:-true}
      - NODE_ENV=${NODE_ENV:-development}
      - WATCHPACK_POLLING=true
    depends_on:
      networth:
        condition: service_started
      community:
        condition: service_started
    restart: unless-stopped

volumes:
  oracle_data:
